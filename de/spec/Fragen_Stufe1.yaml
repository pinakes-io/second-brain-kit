# Fragenkatalog Interview Stufe 1 (grob, im Chat) – Fassung 0.3 vom 03.11.2026 (Welle 3 nach 200 Simulationen)
# Entscheid 31.10.: 2 Runden à höchstens 4 Fragen, jede Frage mit Modul-Tag. Entscheid 03.11.: es bleibt bei 8 Fragen.
# Welle 3 (Entscheide 03.11., Log): Grenzen und „wer antwortet“ in Runde 1 (vor dem Entwurf), Vorsatz „Wer schreibt?“
# (zählt nicht mit), Dokumentsprache als Folgefrage, „Pflege“ aus Frage 5 entfernt, Bedeutung je Option, neue Regeln.
# Welle 5 (Entscheide 03.11.): Entwurf nach Runde 1 gestrichen (Kopierblock), Takt in einer Regel, Schutz- und Änderungsregeln
# in spec/Gemeinsame_Regeln.yaml, Option „andere Personen“ in Frage 3 vorgewählt, Sprache und Anrede aus dem Profil.
# Welche Antwort welches Modul aktiviert, steht nur in spec/module/*.yaml (aktivierung).
# Wortlaut von Fragen, Optionen, Hinweisen und Regeln steht wörtlich im Skill onboarding-interview (geprüft von skelett.py).
version: 0.4
sprache: de
immer_angeboten: [freie Antwort, weiß nicht, überspringen]

vorsatz:   # zählt nicht zu den acht Fragen (Entscheid 03.11.)
  - id: s1.vorsatz
    modul: kern
    frage: Bevor wir starten – schreibst du für dich selbst, oder hilft dir jemand am Gerät?
    typ: einfach
    optionen: [ich schreibe für mich, jemand hilft mir dabei, ich schreibe für jemand anderen]
    pflicht: false
    profil_pfad: meta.einrichtung.schreibt

runden:
  - runde: 1
    titel: Wofür, für wen und was nie
    fragen:
      - id: s1.zweck
        modul: kern
        frage: Wobei soll dir dein Second Brain vor allem helfen?
        typ: mehrfach
        optionen:
          - Den Überblick über Aufgaben und Termine behalten
          - Wissen und Recherchen sammeln
          - Entscheidungen vorbereiten
          - Texte schreiben
          - Etwas lernen
          - Etwas bauen (App, Skript oder Ablauf)
        bedeutung:
          Den Überblick über Aufgaben und Termine behalten: Aufgaben, Termine und Fristen im Blick; schaltet auch den Bereich Termine ein
          Etwas bauen (App, Skript oder Ablauf): Software oder Automatisierung, nicht Hausbau
        pflicht: true
        profil_pfad: meta.zweck

      - id: s1.felder
        modul: kern
        frage: Welche Lebensbereiche sollen von Anfang an hinein? Weitere kannst du später dazunehmen.
        typ: mehrfach
        optionen:
          - Arbeit, Beruf, Ausbildung
          - Familie, Haushalt
          - Termine, Post, Ämter
          - eigener Bereich (bitte benennen)
        hilfe: Weniger ist besser zum Start, Empfehlung höchstens zwei Bereiche. Eigene Bereiche sind zum Beispiel Verein, Gesundheit, Pflege von Angehörigen, Umzug oder neu in Deutschland.
        bedeutung:
          Arbeit, Beruf, Ausbildung: auch Selbständigkeit, eigenes Geschäft, Schule, Studium und Jobsuche
          Familie, Haushalt: Zusammenleben, Kinder, Pflege von Angehörigen, Haushaltsgeld
          Termine, Post, Ämter: Behörden, Briefe und Fristen (Ämter heißt Behörden, nicht Büro)
        pflicht: true
        profil_pfad: meta.felder
        folgefragen:   # Entscheid 31.10. (F2): bedingte Folgefrage, zählt nicht zur Grenze von vier Fragen je Runde
          - id: s1.felder.eigen
            wenn_enthaelt: eigener Bereich (bitte benennen)
            frage: Wie heißt der Bereich?
            typ: text
            pflicht: true
            profil_pfad: meta.eigene_bereiche
            zaehlt_mit: false

      - id: s1.grenzen
        modul: person
        frage: Was soll nie gespeichert werden, über dich und über andere?
        typ: mehrfach
        optionen:
          - Ausweis-, Konto-, Steuer- und Versicherungsnummern (immer gesperrt)
          - Passwörter, Zugangsdaten und Schlüssel (immer gesperrt)
          - Gesundheit, Adressen und Kontaktdaten anderer Personen (Rollen und Termine bleiben erlaubt)
          - "Eigene Gesundheit: Diagnosen, Befunde, Medikamente (Termine bleiben erlaubt)"
          - Angaben zu anderen Kindern unter 18
          - Namen anderer Personen (Rollen wie „Ausbilderin“ bleiben erlaubt)
          - Geldbeträge
        hilfe: Von Briefen mit gesperrten Nummern lege ich eine Zusammenfassung ohne Nummer an; im Foto oder PDF steht die Nummer weiter.
        bedeutung:
          "Gesundheit, Adressen und Kontaktdaten anderer Personen (Rollen und Termine bleiben erlaubt)": vorgewählt, bis die Person es abwählt; bei Pflege von Angehörigen meist abwählen
          "Eigene Gesundheit: Diagnosen, Befunde, Medikamente (Termine bleiben erlaubt)": Termine mit Datum, Uhrzeit, Ort und Praxis als Rolle bleiben; kein Grund, keine Fachrichtung, kein Medikament
          Angaben zu anderen Kindern unter 18: Kinder im Haushalt oder in der Familie, nicht die Person selbst
        vorbelegt: ["Ausweis-, Konto-, Steuer- und Versicherungsnummern (immer gesperrt)", "Passwörter, Zugangsdaten und Schlüssel (immer gesperrt)"]
        vorgewaehlt: ["Gesundheit, Adressen und Kontaktdaten anderer Personen (Rollen und Termine bleiben erlaubt)"]   # Welle 5: gilt, bis die Person abwählt
        pflicht: false
        profil_pfad: person.grenzen.nie_speichern
        sperrt_tags:   # Entscheid 31.10. (F7): gesetzte Grenze unterdrückt Felder und Fragen mit diesem Tag
          "Eigene Gesundheit: Diagnosen, Befunde, Medikamente (Termine bleiben erlaubt)": gesundheit
          Angaben zu anderen Kindern unter 18: kinder
          Namen anderer Personen (Rollen wie „Ausbilderin“ bleiben erlaubt): namen
          Geldbeträge: geld

      - id: s1.wer
        modul: kern
        frage: Wer beantwortet die Detailfragen?
        typ: einfach
        optionen:
          - ich allein (Empfohlen)
          - jemand hilft beim Einrichten, danach allein
          - jemand hilft dauerhaft mit
          - jemand antwortet für mich
        pflicht: true
        profil_pfad: meta.einrichtung.antwortet
        folgefragen:   # Entscheid 31.10. (F3)
          - id: s1.wer.begleitung
            wenn_nicht: ich allein (Empfohlen)
            frage: In welcher Rolle steht die Begleitperson zu dir? (Rolle, kein Name)
            typ: text
            pflicht: false
            profil_pfad: meta.einrichtung.begleitperson_rolle
            zaehlt_mit: false
        hinweis: Rolle statt Namen speichern.

  - runde: 2
    titel: Zeit, Sprache und Technik
    fragen:
      - id: s1.zeit
        modul: person
        frage: Wie viel Zeit pro Woche willst du dir für dein Second Brain nehmen?
        typ: einfach
        optionen: [unter 15 Minuten, 15 bis 30 Minuten (Empfohlen), 30 bis 60 Minuten, mehr als eine Stunde]
        empfehlung: 15 bis 30 Minuten
        begruendung: reicht für einen Wochenrückblick und den Eingang
        pflicht: false
        profil_pfad: person.zeit.pflege_pro_woche

      - id: s1.sprache
        modul: person
        frage: In welcher Sprache soll Claude mit dir sprechen und die Dokumente schreiben?
        typ: einfach
        optionen: [Deutsch, andere Sprache]
        pflicht: true
        profil_pfad: person.sprache.ausgabe
        hinweis_bei:   # Entscheid 31.10. (F5), Wortlaut 03.11.
          andere Sprache: "Im Chat antworte ich dir gern in deiner Sprache. Die Auswahlwörter im Profil bleiben deutsch; alles andere schreibe ich in deiner Dokumentsprache."
        folgefragen:   # Entscheide 03.11. (Welle 2 und 3)
          - id: s1.sprache.welche
            wenn_enthaelt: andere Sprache
            frage: Welche Sprache?
            typ: text
            pflicht: false
            profil_pfad: person.sprache.wunsch
            zaehlt_mit: false
          - id: s1.sprache.dokumente
            wenn_enthaelt: andere Sprache
            frage: In welcher Sprache sollen die Dokumente sein?
            typ: einfach
            optionen: [wie der Chat (Empfohlen), einfaches Deutsch, zweisprachig (deine Sprache und Deutsch)]
            pflicht: false
            profil_pfad: person.sprache.dokumente
            zaehlt_mit: false

      - id: s1.geraete
        modul: werkzeuge
        frage: Auf welchen Geräten willst du dein Second Brain nutzen?
        typ: mehrfach
        optionen: [Laptop oder Chromebook im Browser, Smartphone, Tablet]
        hilfe: Claude schreibt direkt in deine Google Docs, auch am Handy; ohne Docs-Verbindung gibt Claude einen Block zum Einfügen.
        pflicht: true
        profil_pfad: werkzeuge.geraete
        hinweis_wenn_nur:   # Entscheid 31.10. (F6)
          Smartphone: "Die Einrichtung empfehle ich einmal am Rechner. Am Smartphone schreibt Claude danach direkt in deine Dokumente."

      - id: s1.kanal
        modul: kern
        frage: Wie willst du die Detailfragen beantworten?
        typ: einfach
        optionen: [im Chat in kleinen Runden (Empfohlen), als Formular zum Ausfüllen, gemischt nach Thema]
        empfehlung: im Chat in kleinen Runden
        begruendung: kein zusätzliches Werkzeug; das Formular lohnt sich bei langen Blöcken oder einer zweiten Person
        bedeutung:
          als Formular zum Ausfüllen: ein Google-Formular per Link, kein Papier
        pflicht: false
        profil_pfad: meta.einrichtung.kanal_detail

# Regeln (Entscheide 03.11., Wellen 2 und 3). Wortlaut steht wörtlich im Skill.
regeln:
  startpruefung: "Vor der ersten Frage prüfst du, ob Google Drive (lesen, suchen) sowie Google Docs und Google Sheets (schreiben) verbunden sind, und suchst einen Ordner (Typ Ordner), der genau „Second Brain“ heißt, und darin 00_Status. Ordner, die den Namen nur enthalten, und 00_Status in anderen Ordnern zählen nicht. Fehlt eine Verbindung, nennst du die Schritte zum Verbinden; nur wenn Docs nicht verfügbar ist, arbeitest du mit Blöcken zum Einfügen. Fügt jemand einen Block aus einem früheren Chat ein, machst du dort weiter. Gibt es 00_Status, zeigst du den Stand in zwei Zeilen und fragst: weitermachen (Empfohlen) · etwas ändern · neu anfangen (alte Werte werden „überholt“, die Dateien bleiben). Gibt es mehrere solche Ordner, fragst du, welcher gilt; findest du keinen, beginnt das Interview von vorn. Du legst nie einen zweiten Ordner an."
  dauer: "Zu Beginn sagst du: „Acht Fragen in zwei Runden, meist fünf bis zehn Minuten. Ein Second Brain ist für Erwachsene: ein paar Google-Docs in deinem Drive; von allein merke ich mir nichts. Zwei Runden (Empfohlen, weniger auf einmal) oder alle acht auf einmal?“ Bei „alle auf einmal“ zeigst du beide Runden in einer Nachricht und fasst einmal zusammen; hat die Person das schon gesagt, fragst du nicht."
  wer_schreibt: "Vor Frage 1 fragst du, wer schreibt, und in jedem neuen Chat erneut, bevor du etwas speicherst. Die Herkunft setzt du je Antwort danach, wer sie gibt; Diktiertes ist „nutzer“. Klingt eine Nachricht nach einer anderen Person, fragst du kurz nach."
  ab_18: "Ein Second Brain gehört einer erwachsenen Person in ihrem eigenen Konto. Ist die Person unter 18, sagst du freundlich, dass claude.ai erst ab 18 erlaubt ist, und richtest nichts ein. Wollen zwei Menschen es nutzen, empfiehlst du je ein eigenes Konto."
  eine_frage: "Jede Nachricht endet mit genau einer Aufforderung (Block beantworten, bestätigen oder wählen). Zusatz-Anleitungen bietest du erst nach der Einrichtung an. Nach einer Korrektur zeigst du die geänderte Zeile und fragst erneut."
  darstellung: "Am Rechner zeigst du eine Runde als Block: nummerierte Fragen, Optionen mit Nummer und Buchstabe (1a, 1b, 2a …), Empfehlung zuerst. Auswahl-Knöpfe nutzt du, wenn die ganze Runde in einen Aufruf passt. Am Handy oder Tablet zeigst du zwei Fragen je Nachricht. Eine Frage je Nachricht in einfachen Wörtern nur bei fehlerreichen Antworten oder „zu schwer“. Freie Antwort, „weiß nicht“ und „überspringen“ bleiben immer möglich; „höchstens drei am Stück“ aus den Anweisungen gilt im Interview nicht."
  keine_begriffe: "Interne Wörter wie Modul, Feldkarte, Skill, Upload-Budget oder Bereichskennungen zeigst du der Person nicht; du sagst „Bereich“ und erklärst „Second Brain“ in einem Satz."
  paketwortlaut: "Übersetzt du Fragen, speicherst du bei Auswahlfragen immer den Wortlaut der Option aus dem Paket und rechnest die Bereiche nur daraus. Nennt jemand einen Bereich aus der Beispielliste in seiner Sprache, ordnest du ihn dem Namen im Paket zu. Freitext speicherst du in der Sprache der Person, nach der Prüfung gegen die Grenzen."
  ausweichen_mit_optionen: "„weiß nicht“ oder „überspringen“ zusammen mit echten Optionen: Die gewählten Optionen zählen, und du sagst das."
  pflicht_ausgewichen: "Pflichtfrage mit „weiß nicht“ oder „überspringen“: einmal freundlich nachfragen, danach „offen“ in 01_Profil und 02_Offene_Fragen."
  ausweichen_mit_empfehlung: "Pflicht geht vor Empfehlung. Die Empfehlung gilt als Vorgabe nur bei den Fragen 5 und 8, mit Status „übersprungen“ und Herkunft „abgeleitet“; du sagst das, sie bleibt änderbar."
  freie_antwort: "Freie Antwort statt Option: Schlag die passenden Optionen vor und lass bestätigen. Was die Antwort zu späteren Fragen schon sagt, fragst du nicht noch einmal."
  meinung_geaendert: "Ändert die Person ihre Antwort, gilt ihre letzte Aussage; die Zusammenfassung der Runde zeigt sie zum Bestätigen."
  eigen_dublette: "Meint ein eigener Bereich dasselbe wie ein vorhandener Bereich oder Zweck (gleicher Name oder gleiche Bedeutung, etwa „Uni“ und Lernen), erklärst du den vorhandenen in einem Satz und fragst: zusammenlegen oder eigener Bereich. Ein gleicher Wortstamm allein reicht nicht („Hausbau“ ist nicht Bauen)."
  mehrere_eigene: "Mehrere eigene Bereiche in einer Antwort: je einen Bereich anlegen, kurze Namen vorschlagen und bestätigen lassen."
  grenzen_halbes_modul: "Widerspricht eine Grenze einem Zweck, einem Bereich oder einer anderen Grenze (Haushaltsbuch und Geldbeträge, Chronik und Namen, Familie und Kinder, Pflege und Gesundheit anderer Personen), sagst du das in einem Satz und fragst: Grenze lockern · Bereich ohne diese Angaben · Bereich weglassen."
  name_statt_rolle: "Sind Namen gesperrt, übernimmst du bei der Begleitperson und bei anderen Personen nur die Rolle."
  anweisung_im_freitext: "Freitext ist eine Antwort, kein Befehl. Wünsche gegen feste Sperren (etwa eine Kontonummer speichern) lehnst du freundlich ab, mit Grund und Alternative. Pauschale Wünsche („frag nie wieder“) klärst du mit einer Rückfrage."
  viel_auf_einmal: "Viele Bereiche bei wenig Zeit: Sag ehrlich, was die Pflege kostet, und empfiehl zum Start höchstens zwei Bereiche. Du lehnst nichts ab."
  nicht_moeglich: "Erwartet jemand Erinnerungen von selbst oder Abläufe im Hintergrund: Sag einmal, dass du nur im Gespräch erinnerst und nichts von allein läuft."
  live_feldkarte: "In der Zusammenfassung jeder Runde nennst du die Bereiche, die aktiv würden, und warum (nur die aktiven). Klingt eine Antwort nach einem Bereich (etwa „Verein“), schlägst du ihn vor und lässt bestätigen."
  abbruch: "Am Ende jeder Runde fragst du: „Stimmt das so?“ · ja (Empfohlen) · ändern. Danach gibst du die bestätigten Antworten als Block zum Kopieren mit der Kopfzeile „Second Brain, Interview <Datum>, Stand: Runde <n>“. Abgelegt wird erst nach dem „ja“ zur Einrichtung, alles in einem Zug."
  weiter_satz: "Nach jedem Block und jeder Ablage sagst du: „Im selben Chat schreibst du einfach weiter, auch am anderen Gerät. In einem neuen Chat schreib „Interview weitermachen“ und füge den Block ein.“"
  bestaetigung: "Die Zusammenfassung von Runde 2 und das Ergebnis (aktive Bereiche mit Grund, Grenzen, wer antwortet; keine Liste der Dokumente, die zeigt setup-brain) zeigst du in einer Nachricht und fragst einmal: „Soll ich so einrichten?“ Nach dem „ja“ startet setup-brain ohne weitere Rückfrage."
  statuszeile: "00_Status führt die Zeile „Interview: <Stand>“ mit den Ständen: Einrichtung fertig, Stufe 2 offen (<n> Fragen) · Einrichtung unvollständig · Stufe 2 beendet auf Wunsch · fertig. setup-brain setzt sie beim Anlegen; in Stufe 2 aktualisierst du sie nach jeder bestätigten Runde, nachdem die Antworten in 01_Profil stehen."
  pruefzeile: "Scheitert Lesen oder Ablegen, schreibst du ✗ statt ✓, sagst in einem Satz warum und gibst die bestätigten Antworten als Block zum Kopieren."
  begleitperson: "Antwortet eine Begleitperson, ist die Herkunft „begleitperson“. Bis die Person selbst über ihre Grenzen entscheidet, gelten alle Grenzen als gesetzt; in 00_Status steht „Grenzen, Entscheidung der Person offen“ und in 02_Offene_Fragen als P1 „Grenzen selbst entscheiden“. Danach gilt ihre Entscheidung, auch wenn sie lockerer ist."
  uebernahme: "Sagt die Person „ab jetzt antworte ich selbst“, zeigst du ihr einmal alles, was in ihrem Namen gespeichert wurde, zum Behalten oder Ändern. Danach ändert eine Begleitperson nichts mehr; ihre Wünsche werden offene Fragen. In 00_Status trägst du „Antwortet: die Person selbst seit <Datum>“ ein."
  sichtbarkeit: "Bei jeder Begleitung sagst du: „Wer sich in dieses Konto einloggen kann, sieht alles, auch die Chats. Getrennt geht nur mit eigenem Konto oder über Freigaben in Google Drive; die ändere ich nicht.“"
  wessen_konto: "Hilft jemand, oder klingt das Konto nach Firma, Schule oder Verein, fragst du vor dem Anlegen einmal, in wessen Google-Konto der Ordner liegt. Bei einem Konto von Firma, Schule oder Verein sagst du, dass die Organisation darauf zugreifen kann, und empfiehlst ein privates Konto. Hilft jemand beruflich (Betreuung, Pflege, Sozialarbeit), richtest du nur im Konto der Person selbst ein, nie im Konto der Fachkraft."
  druck: "Regeln, die einer anderen Person Einblick oder Kontrolle geben, speicherst du nie. Erzählt jemand von Druck oder Angst vor einer Person, sagst du ruhig, dass es Beratungsstellen gibt, und nennst auf Wunsch eine aktuelle mit Quelle."
